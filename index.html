<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    

  </head>
    
  <body>
  <title>أين نضع ملابسنا؟</title>
<style>
  :root{--purple:#6c5ce7;--blue:#2f7df6;--green:#4caf50;--red:#ff4d4d;--ink:#3a3a4a;--sub:#7c7c92;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fef6e4 0%,#e8f4fd 100%);
    font-family:"Tahoma","Segoe UI",Arial,sans-serif;direction:rtl;color:var(--ink);display:flex;justify-content:center;}
  .app{width:100%;max-width:500px;min-height:100vh;display:flex;flex-direction:column;padding:12px 16px 24px;position:relative;}
  .sound-toggle{position:fixed;top:12px;left:12px;width:40px;height:40px;border-radius:50%;border:none;background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.15);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;}
  .sound-toggle:active{transform:scale(.9);}
  header{text-align:center;padding-top:8px;margin-bottom:10px;}
  header h1{font-size:20px;margin:0 0 4px;font-weight:800;}
  header p{font-size:13px;margin:0;color:var(--sub);}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}
  /* levels */
  .level-list{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .level-card{background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:18px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;border:5px solid transparent;}
  .level-card:active{transform:scale(.98);}
  .level-card .icon{font-size:34px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#f4f1ff;border-radius:16px;flex-shrink:0;}
  .level-card .txt{flex:1;text-align:right;}
  .level-card .txt h3{margin:0 0 4px;font-size:16px;font-weight:800;}
  .level-card .txt p{margin:0;font-size:13px;color:var(--sub);}
  .dots-mini{display:flex;gap:4px;margin-top:8px;}
  .dots-mini span{width:7px;height:7px;border-radius:50%;background:#e6e6ee;}
  .dots-mini span.done{background:var(--green);}
  /* شريط أعلى الصفحة: السهم + نقاط التكرار */
  .top-bar{display:none;align-items:center;gap:14px;margin:0 0 10px;padding-left:52px;}
  .top-bar.show{display:flex;}
  .back-btn{border:none;background:#fff;border-radius:50%;width:40px;height:40px;box-shadow:0 3px 8px rgba(0,0,0,.12);font-size:18px;cursor:pointer;flex-shrink:0;}
  .back-btn:active{transform:scale(.92);}
  .progress{display:flex;gap:10px;align-items:center;}
  .progress span{width:14px;height:14px;border-radius:50%;background:#dfe6f3;transition:transform .2s,background .2s;}
  .progress span.current{background:var(--blue);box-shadow:0 0 0 4px rgba(47,125,246,.25);}
  .progress span.done{background:var(--green);transform:scale(1.1);}
  /* game */
  .prompt-box{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:14px;display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .prompt-box p{flex:1;margin:0;font-size:19px;font-weight:700;line-height:1.6;text-align:right;}
  .speak-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--purple);color:#fff;font-size:16px;flex-shrink:0;cursor:pointer;}
  .speak-btn.speaking{animation:pulse .6s infinite alternate;}
  @keyframes pulse{from{box-shadow:0 0 0 0 rgba(108,92,231,.5);}to{box-shadow:0 0 0 10px rgba(108,92,231,0);}}
  .cards-wrap{display:flex;flex-direction:column;gap:12px;}
  .card{position:relative;background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);border:5px solid transparent;overflow:hidden;cursor:pointer;transition:border-color .2s;}
  .card:active{transform:scale(.98);}
  .card.locked{cursor:default;}
  .card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;image-rendering:auto;}
  .card.correct{border-color:var(--green);}
  .card.wrong-flash{border-color:var(--red);animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
  .badge{position:absolute;top:8px;left:8px;width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;opacity:0;transform:scale(.4);transition:opacity .3s,transform .3s;}
  .badge.show{opacity:1;transform:scale(1);}
  .xmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;}
  .xmark.show{opacity:1;}
  .xmark span{font-size:80px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  .game-area{transition:opacity .25s;}
  .game-area.fading{opacity:0;}
  #gameArea.lvl-2 .prompt-box{padding:10px 14px;margin-bottom:10px;}
  #gameArea.lvl-2 .prompt-box p{font-size:17px;}
  #gameArea.lvl-2 .cards-wrap{gap:8px;}
  /* summary */
  .summary-card{background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:28px 20px;text-align:center;margin-top:12px;}
  .summary-card h2{font-size:24px;margin:0 0 6px;}
  .summary-card .score{font-size:34px;font-weight:900;color:var(--purple);margin:10px 0;}
  .stars{font-size:30px;letter-spacing:4px;margin-bottom:14px;}
  .summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .summary-actions button{border:none;padding:11px 18px;border-radius:28px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--purple);color:#fff;}
  .btn-secondary{background:#f0f0f6;color:var(--ink);}
</style>

<div class="app">
  <button class="sound-toggle" id="soundToggle" aria-label="الصوت">🔊</button>

  <!-- أعلى الصفحة: السهم ونقاط التكرار -->
  <div class="top-bar" id="topBar">
    <button class="back-btn" id="backBtn" aria-label="رجوع">➡</button>
    <div class="progress" id="progressDots"></div>
  </div>

  <header id="mainHeader">
    <h1>أين نضع ملابسنا؟</h1>
    <p>لعبة اختيار السلوك الصحيح</p>
  </header>

  <section class="screen active" id="screen-levels">
    <div class="level-list">
      <div class="level-card" data-level="1">
        <div class="icon">👕</div>
        <div class="txt"><h3>المستوى الأول</h3><p>اختر بين صورتين</p><div class="dots-mini" id="miniDots1"></div></div>
      </div>
      <div class="level-card" data-level="2">
        <div class="icon">🎯</div>
        <div class="txt"><h3>المستوى الثاني</h3><p>اختر بين ثلاث صور</p><div class="dots-mini" id="miniDots2"></div></div>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-game">
    <div class="game-area" id="gameArea">
      <div class="prompt-box">
        <button class="speak-btn" id="speakBtn" aria-label="أعد السؤال">🔊</button>
        <p>أَيْنَ نَضَعُ مَلَابِسَنَا بَعْدَ خَلْعِهَا؟</p>
      </div>
      <div class="cards-wrap" id="cardsWrap"></div>
    </div>
  </section>

  <section class="screen" id="screen-summary">
    <div class="summary-card">
      <h2>أحسنت! 🎉</h2>
      <div class="score" id="summaryScore">5 / 5</div>
      <div class="stars" id="summaryStars">⭐⭐⭐</div>
      <div class="summary-actions">
        <button class="btn-secondary" id="restartLevelBtn">إعادة المستوى</button>
        <button class="btn-primary" id="nextActionBtn">المستوى التالي</button>
      </div>
    </div>
  </section>
</div>

<audio id="player" preload="auto" playsinline></audio>

const LEVELS = {
  1: ["good","floor"],
  2: ["good","basket","bed"]
};
const ROUNDS = 5;
const NEXT_DELAY = 1200;   // المدة بعد انتهاء صوت "ممتاز" قبل التكرار التالي
const X_TIME = 2000;       // مدة ظهور ❌

const $ = id => document.getElementById(id);
const player = $("player");
player.volume = 1.0;
let soundOn = true, level = 1, round = 0, score = 0, firstTry = true, busy = false;
let doneRounds = {1:0, 2:0};
let timers = [];

function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

function play(key, onEnd){
  player.onended = null;
  player.pause();
  $("speakBtn").classList.remove("speaking");
  if(!soundOn){ if(onEnd) later(onEnd, 400); return; }
  player.src = SND[key];
  player.volume = 1.0;
  player.currentTime = 0;
  if(key === "q") $("speakBtn").classList.add("speaking");
  let finished = false;
  const done = () => { if(finished) return; finished = true;
    $("speakBtn").classList.remove("speaking"); if(onEnd) onEnd(); };
  player.onended = done;
  const p = player.play();
  if(p && p.catch) p.catch(() => later(done, 800));
}
function stopSound(){ player.onended = null; player.pause(); $("speakBtn").classList.remove("speaking"); }

function show(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $("screen-" + name).classList.add("active");
  $("topBar").classList.toggle("show", name === "game");
}
function renderMini(){
  [1,2].forEach(l => {
    $("miniDots"+l).innerHTML = Array.from({length:ROUNDS},(_,i)=>`<span class="${i<doneRounds[l]?'done':''}"></span>`).join("");
  });
}
function renderProgress(){
  $("progressDots").innerHTML = Array.from({length:ROUNDS},(_,i)=>
    `<span class="${i<round?'done':(i===round?'current':'')}"></span>`).join("");
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startLevel(l){
  clearTimers(); level = l; round = 0; score = 0;
  $("gameArea").className = "game-area lvl-" + l;
  show("game");
  buildRound();
}
function buildRound(){
  busy = false; firstTry = true;
  renderProgress();
  const wrap = $("cardsWrap");
  wrap.innerHTML = "";
  shuffle(LEVELS[level]).forEach(key => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<img src="${IMG[key]}" alt="" decoding="async"><div class="badge">✓</div><div class="xmark"><span>❌</span></div>`;
    c.onclick = () => choose(c, key === "good");
    wrap.appendChild(c);
  });
  $("gameArea").classList.remove("fading");
  play("q");
}
function choose(card, ok){
  if(busy) return;
  busy = true;
  stopSound();
  if(ok){
    if(firstTry) score++;
    card.classList.add("correct");
    card.querySelector(".badge").classList.add("show");
    document.querySelectorAll(".card").forEach(c => c.classList.add("locked"));
    play("ok", () => later(nextRound, NEXT_DELAY));
  } else {
    firstTry = false;
    card.classList.add("wrong-flash");
    const x = card.querySelector(".xmark");
    x.classList.add("show");
    later(() => { x.classList.remove("show"); card.classList.remove("wrong-flash"); }, X_TIME);
    play("no", () => { busy = false; });
  }
}
function nextRound(){
  round++;
  doneRounds[level] = Math.max(doneRounds[level], round);
  if(round >= ROUNDS){ renderProgress(); finish(); return; }
  $("gameArea").classList.add("fading");
  later(buildRound, 300);
}
function finish(){
  renderMini();
  $("summaryScore").textContent = score + " / " + ROUNDS;
  $("summaryStars").textContent = score >= 5 ? "⭐⭐⭐" : score >= 3 ? "⭐⭐" : "⭐";
  $("nextActionBtn").textContent = level === 1 ? "المستوى الثاني" : "المستويات";
  show("summary");
}

document.querySelectorAll(".level-card").forEach(c => c.onclick = () => startLevel(+c.dataset.level));
$("backBtn").onclick = () => { clearTimers(); stopSound(); renderMini(); show("levels"); };
$("speakBtn").onclick = () => { if(!busy) play("q"); };
$("restartLevelBtn").onclick = () => startLevel(level);
$("nextActionBtn").onclick = () => { if(level === 1) startLevel(2); else { renderMini(); show("levels"); } };
$("soundToggle").onclick = () => {
  soundOn = !soundOn;
  $("soundToggle").textContent = soundOn ? "🔊" : "🔇";
  if(!soundOn) stopSound();
};
renderMini();
</script>
    
  </body>
  
</html>
